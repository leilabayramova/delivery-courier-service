server:
  port: 8081

spring:
  application:
    name: courier-service

  datasource:
    url: jdbc:h2:mem:courierdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:changelog-master.yaml